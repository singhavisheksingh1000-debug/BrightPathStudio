name: Add hero slider styles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  style:
    if: "!contains(github.event.head_commit.message, 'Add professional hero slider and blog styles')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append hero and blog CSS
        run: |
          cat >> styles.css <<'EOF'

/* ===== BRIGHTPATHSTUDIO REDESIGNED HERO ===== */
.hero-redesigned{width:min(1236px,100%);padding:64px 28px 88px;display:block;}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.9fr);gap:58px;align-items:center;}
.hero-redesigned .hero-copy{min-width:0;}
.hero-redesigned .hero-copy h1{font-size:clamp(40px,5vw,64px);max-width:650px;}
.hero-redesigned .hero-copy p{max-width:56ch;}
.hero-slider{position:relative;width:100%;height:440px;min-width:0;overflow:hidden;border:1px solid var(--line);background:var(--ink);box-shadow:0 24px 50px -30px rgba(32,41,31,.45);}
.hero-slide{position:absolute;inset:0;display:block;color:#fff;text-decoration:none;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility .55s ease;}
.hero-slide.is-active{opacity:1;visibility:visible;z-index:2;}
.hero-slide-image{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01);transition:transform 5.5s ease;}
.hero-slide.is-active .hero-slide-image{transform:scale(1.06);}
.hero-slide-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,25,19,.05) 20%,rgba(20,25,19,.8) 100%);}
.hero-slide-content{position:absolute;left:30px;right:30px;bottom:32px;z-index:3;}
.hero-slide-kicker,.blog-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;}
.hero-slide-content h2{color:#fff;font-size:clamp(30px,4vw,48px);margin:8px 0 3px;line-height:1.02;}
.hero-slide-content p{color:rgba(255,255,255,.9);font-size:15px;margin:0 0 14px;}
.hero-slide-link{display:inline-block;font-family:var(--mono);font-size:12px;border-bottom:1px solid rgba(255,255,255,.75);padding-bottom:2px;}
.hero-slider-arrow{position:absolute;top:50%;z-index:5;transform:translateY(-50%);width:40px;height:40px;border:1px solid rgba(255,255,255,.55);background:rgba(20,25,19,.35);color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.hero-slider-prev{left:16px}.hero-slider-next{right:16px}.hero-slider-arrow:hover{background:rgba(20,25,19,.7);}
.hero-slider-dots{position:absolute;z-index:6;right:28px;top:24px;display:flex;gap:7px;}
.hero-slider-dots button{width:7px;height:7px;border:1px solid rgba(255,255,255,.8);background:transparent;border-radius:50%;padding:0;}
.hero-slider-dots button.is-active{background:#fff;}
.blog-teaser{background:var(--paper-card);border-top:1px solid var(--line);}
.blog-placeholder-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.blog-placeholder-grid article{background:var(--paper);border:1px solid var(--line);padding:28px;min-height:220px;}
.blog-placeholder-grid h3{font-size:22px;margin:12px 0 10px;line-height:1.15;}
.blog-placeholder-grid p{color:var(--ink-soft);font-size:14px;margin:0;}
.blog-label{color:var(--accent-ink);}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;gap:40px}.hero-slider{height:400px}.blog-placeholder-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.hero-redesigned{padding:44px 20px 64px}.hero-slider{height:380px}.hero-slide-content{left:22px;right:22px;bottom:26px}.hero-slider-arrow{width:36px;height:36px}.blog-placeholder-grid{grid-template-columns:1fr}.hero-redesigned .hero-copy h1{font-size:40px;}}
EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Add professional hero slider and blog styles"
          git push
