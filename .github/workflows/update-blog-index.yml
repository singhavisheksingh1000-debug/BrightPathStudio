name: Update BrightPathStudio Blog Index

on:
  push:
    branches: [main]
    paths:
      - 'blog/**/*.html'
      - 'blog/*.html'
      - 'scripts/generate-blog-index.py'
      - 'blog-loader.js'
      - '.github/workflows/update-blog-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate blog manifest
        run: python scripts/generate-blog-index.py

      - name: Ensure automatic blog loader is included everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '<script src="/blog-loader.js"></script>'
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if marker in text:
                  continue
              if '</body>' in text:
                  path.write_text(text.replace('</body>', f'{marker}</body>', 1), encoding='utf-8')
          PY

      - name: Commit generated blog updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/posts.json '*.html' 'blog/**/*.html' || true
          if git diff --cached --quiet; then
            echo 'No blog index changes to commit.'
            exit 0
          fi
          git commit -m 'chore: automatically update blog index and navigation'
          git push
