name: Add ADHD Focus and Time Planner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-product:
    if: "!contains(github.event.head_commit.message, 'Add ADHD Focus and Time Planner')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add product card if missing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="featured-adhd-focus-time-cta"'
          if marker in s:
              raise SystemExit(0)

          card = '''
              <article class="product-card"><div class="product-media" style="--tab-c:var(--c-adhd); --img:url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=600&auto=format&fit=crop');"><span class="product-cat">ADHD</span></div><div class="product-body"><h3>ADHD Focus & Time Planner</h3><p>🧠 A digital ADHD productivity planner for time management, focus, deep work, task planning, and getting things done with less overwhelm.</p><div class="product-foot"><span class="rating">★★★★★</span><span class="price">Premium</span></div><a class="btn btn-primary" href="https://avisheksingh3.gumroad.com/l/jbeldk" target="_blank" rel="noopener noreferrer" id="featured-adhd-focus-time-cta">GET THE FOCUS & TIME PLANNER →</a></div></article>'''

          closing = '  </div></div></section>\n</main>'
          if closing not in s:
              raise SystemExit('Featured products closing marker not found')
          s = s.replace(closing, '    ' + card + '\n  </div></div></section>\n</main>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add ADHD Focus and Time Planner"
          git push
